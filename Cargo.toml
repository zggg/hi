[workspace]
resolver = "2"
members = [
    "core",
    "ai",
    "tui",
    "gateway",
    "app",
    "architecture-tests",
]

[workspace.package]
version = "0.0.9"
edition = "2021"
license = "MIT"
authors = ["hi contributors"]
readme = "README.md"
repository = "https://github.com/zggg/hi"
homepage = "https://github.com/zggg/hi"
description = "Rust personal AI agent — ultra-lightweight TUI, CLI chat, and optional IM gateway sharing one Agent core"
keywords = ["ai", "agent", "llm", "tui", "cli"]
categories = ["command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
cliclack = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
toml = { version = "0.8", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# scrolling-regions：insert_before 走 DECSTBM 滚动区域 + Buffer::diff 路径，
# 正确跳过 CJK 宽字符的占位续格，避免「你 好 分 析」式间隙（默认 draw_lines 会逐格输出续格空格）。
ratatui = { version = "0.29", features = ["scrolling-regions"] }
crossterm = "0.28"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
qrcode = "0.14"
prost = "0.13"

hi-core = { path = "core" }
hi-ai = { path = "ai" }
hi-tui = { path = "tui" }
hi-gateway = { path = "gateway" }
hi = { path = "app" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = 0 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
